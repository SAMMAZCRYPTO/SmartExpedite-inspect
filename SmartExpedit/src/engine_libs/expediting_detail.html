<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SmartExpedit - Expediting Detail</title>
<!-- ==========================================================================
     EXPEDITING DETAIL — the expeditor's workspace on one order (v33, M9).

     Opened from Mr. Huzaifa's queue once he has assigned the order. The work,
     in the expeditor's own order:
       MR Study          — the ITR and SDR read out of the MR (contents ->
                           ATTACH-VI / VII -> pages -> tables), checked by eye
       Introduction Letter (top bar) — generated from the order, sent on the
                           portal; the vendor answers each point there
       Document Control  — the Vendor Data Register: created from the SDR,
                           edited by both sides, every change marked,
                           .xlsx out and back in
       Schedule          — the key tab: activity schedule (minimum rows locked,
                           baseline frozen once accepted), itemized per PO line,
                           sub-orders with float, issues as Z003 revisions
       Manufacturing · Shipment & Delivery · Closeout · Follow-up Log

     "View as": NPCC (the expeditor) or the Vendor portal — the same record,
     the vendor sees Letter, Document Register and Schedule.
     No CDN; every class is ep- prefixed.
     ========================================================================== -->
<style>
  html { height:100%; } body { min-height:100%; margin:0; }
  body { font-family:'Segoe UI', Arial, sans-serif; color:#1e293b; font-size:13px; background:#f1f5f9; }
  .tabnum { font-variant-numeric: tabular-nums; }
  [hidden] { display:none !important; }

  .ep-btn { padding:7px 14px; border-radius:7px; font-size:12.5px; font-weight:600; cursor:pointer;
    border:1px solid transparent; display:inline-flex; align-items:center; gap:6px; font-family:inherit; white-space:nowrap; }
  .ep-btn.primary { background:#0d9488; color:#fff; }
  .ep-btn.primary:hover { background:#0f766e; }
  .ep-btn.secondary { background:#fff; color:#334155; border-color:#cbd5e1; }
  .ep-btn.secondary:hover { background:#f1f5f9; }
  .ep-btn.danger { background:#fff; color:#be123c; border-color:#fecdd3; }
  .ep-btn.sm { padding:5px 11px; font-size:11.5px; }
  .ep-btn.xs { padding:3px 8px; font-size:10.5px; border-radius:6px; }
  .ep-btn:disabled { opacity:.45; cursor:not-allowed; }

  .ep-toolbar { display:flex; align-items:center; gap:8px; padding:11px 24px;
    background:#fff; border-bottom:1px solid #e2e8f0; flex-wrap:wrap; }
  .ep-seg { display:inline-flex; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden; }
  .ep-seg button { border:0; background:#fff; padding:6px 12px; font:600 12px 'Segoe UI',Arial,sans-serif; color:#475569; cursor:pointer; }
  .ep-seg button.on { background:#1e293b; color:#fff; }
  .ep-seg-l { font-size:11px; color:#94a3b8; font-weight:700; margin-right:4px; }
  .ep-portal { background:#134e4a; color:#ccfbf1; padding:9px 24px; font-size:12px; display:flex; gap:10px; align-items:center; }
  .ep-portal b { color:#fff; }
  .ep-head { padding:14px 24px 0; }
  .ep-head h2 { margin:0; font-size:19px; font-weight:700; }
  .ep-head .sub { font-size:11.5px; color:#94a3b8; margin-top:3px; }

  .ep-pill { display:inline-flex; align-items:center; gap:6px; padding:3px 11px; border-radius:999px;
    font-size:11px; font-weight:700; background:#e2e8f0; color:#475569; white-space:nowrap; }
  .ep-pill.teal { background:#ccfbf1; color:#0f766e; }
  .ep-pill.warn { background:#fef3c7; color:#92400e; }
  .ep-pill.rose { background:#ffe4e6; color:#9f1239; }
  .ep-pill.slate { background:#e2e8f0; color:#475569; }
  .ep-pill.dark { background:#1e293b; color:#fff; }
  .ep-pill.sm { font-size:9.5px; padding:2px 8px; }

  .ep-tabs { display:flex; gap:2px; padding:12px 24px 0; border-bottom:1px solid #e2e8f0; overflow-x:auto; }
  .ep-tab { padding:10px 15px; font-size:12.5px; font-weight:600; color:#64748b;
    border-bottom:2.5px solid transparent; cursor:pointer; white-space:nowrap; }
  .ep-tab:hover { color:#334155; }
  .ep-tab.active { color:#0f766e; border-bottom-color:#0d9488; }
  .ep-tab .n { font-size:10px; background:#e2e8f0; color:#475569; border-radius:999px; padding:1px 6px; margin-left:4px; }
  .ep-tab .n.rose { background:#ffe4e6; color:#9f1239; }

  .ep-wrap { padding:16px 24px 40px; }
  .ep-card { background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:16px 18px; margin-bottom:16px; }
  .ep-card.flush { padding:0; overflow:hidden; }
  .ep-card-title { display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-size:13px; font-weight:700; margin-bottom:12px; flex-wrap:wrap; }
  .ep-card.flush > .ep-card-title { padding:14px 16px 10px; margin-bottom:0; }
  .ep-note { background:#f0fdfa; border:1px solid #99f6e4; border-left:3px solid #0d9488;
    border-radius:8px; padding:11px 14px; font-size:11.5px; color:#0f766e; line-height:1.65; margin-bottom:14px; }
  .ep-note.warn { background:#fffbeb; border-color:#fde68a; border-left-color:#f59e0b; color:#92400e; }
  .ep-note.rose { background:#fff1f2; border-color:#fecdd3; border-left-color:#e11d48; color:#9f1239; }
  .ep-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .ep-sp { flex:1; }

  .ep-fields { display:grid; grid-template-columns:repeat(4, 1fr); gap:1px; background:#e2e8f0;
    border:1px solid #e2e8f0; border-radius:8px; overflow:hidden; margin-bottom:14px; }
  .ep-f { background:#fff; padding:11px 13px; min-width:0; }
  .ep-f .k { font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#94a3b8; }
  .ep-f .v { font-size:13px; font-weight:600; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ep-f .v.wrap { white-space:normal; }
  .ep-f.src { background:#f8fafc; }

  .ep-kpis { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; margin-bottom:14px; }
  .ep-kpi { background:#fff; border:1px solid #e2e8f0; border-radius:8px; padding:11px 13px; }
  .ep-kpi .k { font-size:9.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#94a3b8; }
  .ep-kpi .v { font-size:20px; font-weight:800; margin-top:3px; }
  .ep-kpi .s { font-size:10.5px; color:#64748b; margin-top:2px; }

  .ep-in, .ep-sel, .ep-ta { width:100%; box-sizing:border-box; padding:7px 9px; border:1px solid #cbd5e1; border-radius:7px;
    font:13px 'Segoe UI',Arial,sans-serif; color:#1e293b; background:#fff; margin-top:4px; }
  .ep-in:focus, .ep-sel:focus, .ep-ta:focus { outline:none; border-color:#0d9488; box-shadow:0 0 0 2px #ccfbf1; }
  .ep-ta { resize:vertical; min-height:60px; }
  .ep-lbl { font-size:10px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; color:#94a3b8; }

  table.ep-table { width:100%; border-collapse:collapse; font-size:12px; }
  .ep-table th { text-align:left; padding:8px 9px; font-size:10.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
    color:#64748b; background:#f8fafc; border-bottom:1px solid #e2e8f0; white-space:nowrap; }
  .ep-table td { padding:7px 9px; border-bottom:1px solid #f1f5f9; vertical-align:top; }
  .ep-table tr:hover td { background:#fafcff; }
  .ep-table .num { text-align:right; }
  .ep-table .grp td { background:#f8fafc; font-weight:700; color:#475569; font-size:11px; }

  /* the grid — Excel-like */
  .ep-gridwrap { overflow:auto; max-height:640px; border-top:1px solid #e2e8f0; }
  table.ep-grid { border-collapse:collapse; font-size:11.5px; min-width:100%; }
  .ep-grid th { position:sticky; top:0; z-index:2; background:#f1f5f9; border:1px solid #e2e8f0; padding:6px 7px;
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:#475569; text-align:left; white-space:nowrap; }
  .ep-grid th.x { background:#fef9c3; }
  .ep-grid td { border:1px solid #e2e8f0; padding:0; vertical-align:middle; background:#fff; height:28px; }
  .ep-grid td.ro { background:#f8fafc; padding:4px 7px; color:#334155; white-space:nowrap; }
  .ep-grid td.t { padding:4px 7px; }
  .ep-grid input, .ep-grid select { width:100%; box-sizing:border-box; border:0; background:transparent; padding:5px 7px;
    font:11.5px 'Segoe UI',Arial,sans-serif; color:#1e293b; height:28px; }
  .ep-grid input:focus, .ep-grid select:focus { outline:2px solid #0d9488; outline-offset:-2px; background:#f0fdfa; }
  .ep-grid input[readonly] { color:#64748b; }
  .ep-grid td.mk-n { box-shadow:inset 3px 0 0 #0d9488; background:#f0fdfa; }
  .ep-grid td.mk-v { box-shadow:inset 3px 0 0 #f59e0b; background:#fffbeb; }
  .ep-grid tr.del td { background:#f8fafc !important; color:#94a3b8; text-decoration:line-through; }
  .ep-grid tr.del td.act { text-decoration:none; }
  .ep-grid tr.na td { background:#f8fafc; color:#94a3b8; }
  .ep-grid tr.na td input { color:#94a3b8; text-decoration:line-through; }
  .ep-grid tr.itp td:first-child { box-shadow:inset 3px 0 0 #7c3aed; }
  .ep-grid td.act { white-space:nowrap; padding:2px 5px; background:#fff; }
  .ep-grid .lock { color:#94a3b8; font-size:10px; margin-left:4px; }
  .ep-grid td.bad input { color:#be123c; font-weight:700; }
  .ep-ico { border:0; background:none; cursor:pointer; color:#64748b; font-size:13px; padding:2px 4px; border-radius:5px; }
  .ep-ico:hover { background:#f1f5f9; color:#0f766e; }
  .ep-chip { display:inline-block; font-size:9.5px; font-weight:800; padding:1px 6px; border-radius:5px; margin-left:4px; }
  .ep-chip.H { background:#ede9fe; color:#6d28d9; } .ep-chip.W { background:#e0f2fe; color:#0369a1; }
  .ep-chip.min { background:#f1f5f9; color:#64748b; }
  .ep-chip.ven { background:#fef3c7; color:#92400e; } .ep-chip.npc { background:#ccfbf1; color:#0f766e; }

  .ep-bar { position:relative; height:16px; min-width:160px; }
  .ep-bar i { position:absolute; height:6px; border-radius:3px; }
  .ep-bar i.b { top:2px; background:#cbd5e1; } .ep-bar i.f { top:9px; background:#0d9488; } .ep-bar i.f.late { background:#e11d48; }
  .ep-bar i.today { top:0; height:16px; width:1px; background:#f59e0b; border-radius:0; }

  .ep-issues { margin:0; padding:0; list-style:none; }
  .ep-issues li { padding:6px 0 6px 18px; border-bottom:1px solid #f1f5f9; font-size:12px; position:relative; }
  .ep-issues li::before { content:''; position:absolute; left:4px; top:11px; width:7px; height:7px; border-radius:9px; background:#f59e0b; }
  .ep-issues li.rose::before { background:#e11d48; }

  /* stage rail */
  .ep-rail { display:flex; gap:0; overflow-x:auto; padding:14px 0 4px; }
  .ep-step { flex:1; min-width:84px; text-align:center; position:relative; padding:0 4px; }
  .ep-step .dot { width:26px; height:26px; border-radius:999px; background:#e2e8f0; color:#64748b; display:flex;
    align-items:center; justify-content:center; font-size:11px; font-weight:800; margin:0 auto; position:relative; z-index:1; }
  .ep-step.done .dot { background:#0d9488; color:#fff; }
  .ep-step.now .dot { background:#0f766e; color:#fff; box-shadow:0 0 0 4px #ccfbf1; }
  .ep-step::before { content:''; position:absolute; top:13px; left:-50%; width:100%; height:2px; background:#e2e8f0; z-index:0; }
  .ep-step:first-child::before { display:none; }
  .ep-step.done::before, .ep-step.now::before { background:#0d9488; }
  .ep-step .lb { font-size:10px; font-weight:700; color:#64748b; margin-top:6px; line-height:1.3; }
  .ep-step.done .lb, .ep-step.now .lb { color:#0f766e; }
  .ep-step .dt { font-size:9.5px; color:#94a3b8; margin-top:1px; }

  /* MR study */
  .ep-flow { display:flex; gap:0; align-items:stretch; margin-bottom:14px; flex-wrap:wrap; }
  .ep-flow .s { flex:1; min-width:160px; background:#fff; border:1px solid #e2e8f0; padding:10px 12px; position:relative; }
  .ep-flow .s + .s { border-left:0; }
  .ep-flow .s:first-child { border-radius:8px 0 0 8px; } .ep-flow .s:last-child { border-radius:0 8px 8px 0; }
  .ep-flow .s .k { font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:#94a3b8; }
  .ep-flow .s .v { font-size:12.5px; font-weight:700; margin-top:3px; }
  .ep-flow .s .d { font-size:11px; color:#64748b; margin-top:2px; }
  .ep-thumbs { display:flex; gap:10px; flex-wrap:wrap; }
  .ep-thumb { width:118px; cursor:pointer; text-align:center; }
  .ep-thumb img { width:118px; height:166px; object-fit:cover; object-position:top; border:1px solid #cbd5e1; border-radius:5px; background:#fff; display:block; }
  .ep-thumb:hover img { border-color:#0d9488; box-shadow:0 0 0 2px #ccfbf1; }
  .ep-thumb span { font-size:10.5px; color:#475569; font-weight:600; display:block; margin-top:4px; }
  .ep-att { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  .ep-att div { border:1px solid #e2e8f0; border-radius:7px; padding:7px 9px; font-size:11px; background:#fff; }
  .ep-att div.hit { border-color:#0d9488; background:#f0fdfa; }
  .ep-att div.na { color:#94a3b8; }
  .ep-att b { display:block; font-size:10px; color:#0f766e; }
  td.lv { background:#f0fdfa; font-weight:700; }
  .ep-prog { font-family:Consolas,monospace; font-size:11.5px; background:#0f172a; color:#a7f3d0; border-radius:8px; padding:10px 12px;
    max-height:160px; overflow:auto; white-space:pre-wrap; }

  /* modal */
  .ep-modal-bg { position:fixed; inset:0; background:rgba(15,23,42,.45); z-index:50; display:flex;
    align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; }
  .ep-modal { background:#fff; border-radius:12px; width:100%; max-width:560px; overflow:hidden; box-shadow:0 24px 60px rgba(15,23,42,.25); }
  .ep-modal.wide { max-width:860px; } .ep-modal.xwide { max-width:1100px; }
  .ep-modal h3 { margin:0; padding:16px 20px; font-size:15px; border-bottom:1px solid #e2e8f0; }
  .ep-modal .body { padding:18px 20px; max-height:72vh; overflow:auto; }
  .ep-modal .foot { padding:14px 20px; border-top:1px solid #e2e8f0; display:flex; justify-content:flex-end; gap:8px; background:#f8fafc; flex-wrap:wrap; }

  .ep-sub { font-size:11.5px; color:#64748b; line-height:1.6; }
  .ep-modelled { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.03em; padding:2px 7px; border-radius:999px; background:#fef3c7; color:#92400e; }
  .ep-empty { text-align:center; color:#94a3b8; padding:34px; }
  .ep-empty .big { font-weight:700; color:#64748b; margin-bottom:6px; font-size:14px; }
  .ep-letter { border:1px solid #e2e8f0; border-radius:8px; padding:16px 18px; font-size:12.5px; line-height:1.6; background:#fff; }
  .ep-letter table { border-collapse:collapse; margin:8px 0 12px; }
  .ep-letter td { border:1px solid #475569; padding:3px 9px; font-size:12px; }
  .ep-letter ol { padding-left:20px; } .ep-letter li { margin-bottom:6px; }
  .ep-reply { margin-top:6px; padding:7px 10px; border-radius:7px; background:#f0fdfa; border:1px solid #99f6e4; font-size:11.5px; color:#0f766e; }
  .ep-reply.open { background:#fffbeb; border-color:#fde68a; color:#92400e; }
  .ep-toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#1e293b; color:#fff; padding:9px 16px;
    border-radius:8px; font-size:12.5px; z-index:60; box-shadow:0 10px 30px rgba(15,23,42,.3); }
  .ep-subtabs { display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .ep-subtabs button { border:1px solid #cbd5e1; background:#fff; border-radius:999px; padding:6px 13px; font:600 12px 'Segoe UI',Arial,sans-serif; color:#475569; cursor:pointer; }
  .ep-subtabs button.on { background:#0d9488; border-color:#0d9488; color:#fff; }
  .ep-ms { font-size:10.5px; line-height:1.25; padding:3px 6px; cursor:pointer; min-width:74px; }
  .ep-ms .a { color:#047857; font-weight:700; } .ep-ms .f { color:#b45309; font-weight:600; } .ep-ms .p { color:#64748b; }
  .ep-ms:hover { background:#f0fdfa; }
</style>
</head>
<body>

<div class="ep-portal" id="portal-band" hidden></div>
<div class="ep-toolbar">
  <button class="ep-btn secondary" id="back">&larr; Back</button>
  <button class="ep-btn secondary" id="letter-btn">Introduction Letter</button>
  <button class="ep-btn secondary" id="log-btn">Change Log</button>
  <span class="ep-sp"></span>
  <span class="ep-seg-l">View as</span>
  <span class="ep-seg" id="view-seg"><button data-view="npcc" class="on" id="view-npcc">NPCC</button><button data-view="vendor" id="view-vendor">Vendor portal</button></span>
  <span id="stage-pill" class="ep-pill teal"></span>
</div>

<div class="ep-head">
  <h2 id="title"></h2>
  <div class="sub" id="sub"></div>
</div>

<div class="ep-wrap" style="padding-bottom:6px;" id="rail-wrap">
  <div class="ep-card" style="padding:6px 18px 10px;margin-bottom:6px;">
    <div class="ep-rail" id="rail"></div>
  </div>
</div>

<div class="ep-tabs" id="tabs"></div>

<div class="ep-wrap" id="content"></div>

<!-- generic modal shell -->
<div class="ep-modal-bg" id="modal-bg" hidden>
  <div class="ep-modal" id="modal-box">
    <h3 id="modal-title"></h3>
    <div class="body" id="modal-body"></div>
    <div class="foot" id="modal-foot">
      <button class="ep-btn secondary" id="modal-cancel">Cancel</button>
      <button class="ep-btn primary" id="modal-ok">OK</button>
    </div>
  </div>
</div>
<div class="ep-toast" id="toast" hidden></div>
<input type="file" id="file-xlsx" accept=".xlsx" hidden>
<input type="file" id="file-pdf" accept=".pdf" hidden>

<script src="ep_items_data.js"></script>
<script src="ep_mr_data.js"></script>
<script src="ep_sdrl_master.js"></script>
<script src="ep_expediting_data.js"></script>
<script src="xlsx_mini.js"></script>
<script src="ep_xlsx_read.js"></script>
<script src="ep_mr_reader.js"></script>
<script src="ep_mr_74259.js"></script>
<script src="ep_exp_work.js"></script>
<script src="ep_pdf_lib.js"></script>
<script>
/* =========================================================================
   EXPEDITING DETAIL — one order, the expeditor's workspace
   ========================================================================= */
var $ = function (id) { return document.getElementById(id); };
var PO = '', REC = null, TAB = 'head', VIEW = 'npcc', SUB = { sched:'act' };
var MODAL_OK = null, ITEM_PAGE = 0, ITEM_SEL = {};

function fmtDate(iso) {
  if (!iso) return '';
  var d = new Date(String(iso).length === 10 ? iso + 'T00:00:00' : iso); if (isNaN(d)) return iso;
  var M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(d.getDate()).padStart(2,'0') + '-' + M[d.getMonth()] + '-' + d.getFullYear();
}
function fmtDT(iso) {
  if (!iso) return '';
  var d = new Date(iso); if (isNaN(d)) return iso;
  return fmtDate(iso) + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function money(v) { return '$' + Number(v || 0).toLocaleString(undefined, {maximumFractionDigits:0}); }
function n(v) { return Number(v || 0).toLocaleString(); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function today() { return epXToday(); }
function qs(k) { return new URLSearchParams(window.location.search).get(k) || ''; }
function toast(t) { var el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { el.hidden = true; }, 2600); }

/* who is acting: the assigned expeditor (NPCC) or the vendor on the portal */
function WHO() { return VIEW === 'vendor' ? (REC.supplierShort || 'Vendor') + ' (portal)' : (REC.assignedTo || EP_EXP_MANAGER); }
function SIDE() { return VIEW === 'vendor' ? 'Vendor' : 'NPCC'; }

/* the record is edited in memory and written back as a whole —
   the previous save() wrote a fresh reload, which threw edits away */
function loadRec() { REC = epExpFind(PO); }
function saveRec() {
  var list = epExpLoad();
  var i = list.findIndex(function (r) { return r.po === REC.po; });
  if (i >= 0) list[i] = REC; else list.push(REC);
  epExpSave(list);
}
function setStage(key) {
  if (epExpStageIndex(key) > epExpStageIndex(REC.stage)) REC.stage = key;
}
function addLog(txt) { (REC.log = REC.log || []).push({ on:new Date().toISOString(), by:WHO(), txt:txt }); }

/* ------------------------------------------------------------ THE RAIL */
function rail() {
  var reg = (REC.reg && REC.reg.rows) || [];
  var firstIn = reg.filter(function (r) { return !r.deleted && r.actual; }).map(function (r) { return r.actual; }).sort()[0] || '';
  var marks = [
    { key:'issued',    d: REC.issuedOn,  lb:'Issued' },
    { key:'ack',       d: REC.ackDate,   lb:'Acknowledged' },
    { key:'docsOut',   d: REC.kickoffOn, lb:'Kickoff' },

    (REC.lots || []).map(function (l) {

function pageModal(pn) {
  var x = epExpMrExtract(REC); if (!x) return;

      '<button class="ep-btn secondary" id="pg-prev"' + (i <= 0 ? ' disabled' : '') + '>← Previous</button>' +
      '<button class="ep-btn secondary" id="pg-next"' + (i >= all.length - 1 ? ' disabled' : '') + '>Next →</button>' +
      '<button class="ep-btn primary" id="pg-close">Close</button>' });

function mrReadModal() {
  modal('Read an MR PDF',
    '<div class="ep-sub" style="margin-bottom:10px;">Pick the material requisition PDF. The reader goes through the contents (pages 1–3), finds the ITR and SDR attachments by their titles, locates their pages by their own header, renders them and extracts the tables. The file stays in this browser.</div>' +
    '<button class="ep-btn primary" id="mr-pick">Choose the PDF…</button> <span class="ep-sub" id="mr-file"></span>' +
    '<div class="ep-prog" id="mr-prog" style="margin-top:12px;">waiting for a file…</div><div id="mr-res" style="margin-top:12px;"></div>',
    null, { wide:'wide', foot:'<button class="ep-btn secondary" id="mr-cancel">Close</button><button class="ep-btn primary" id="mr-use" disabled>Use for this order</button>' });
  var result = null;
  $('mr-cancel').onclick = closeModal;
  $('mr-pick').onclick = function () { $('file-pdf').value = ''; $('file-pdf').click(); };
  $('file-pdf').onchange = async function () {
    var f = this.files[0]; if (!f) return;
    $('mr-file').textContent = f.name + ' · ' + (f.size / 1048576).toFixed(1) + ' MB';
    var prog = $('mr-prog'); prog.textContent = '';
    var step = function (s) { prog.textContent += s + '\n'; prog.scrollTop = 1e9; };
    try {
      var buf = await f.arrayBuffer();
      result = await epMrExtract(buf, f.name, step, { scale:1.1, quality:0.6 });
    } catch (e) { step('Could not read it: ' + e.message); return; }

function regCell(r, c) {
  var key = c.key, isX = key.indexOf('x:') === 0;
  var v = isX ? (r.x[key.slice(2)] || '') : (r[key] == null ? '' : r[key]);
  var mk = r.marks && r.marks[key];
  var cls = mk ? (mk.side === 'Vendor' ? 'mk-v' : 'mk-n') : '';
  var tip = mk ? 'Changed by ' + mk.by + ' (' + mk.side + ') on ' + fmtDT(mk.on) + ' \u2014 was: ' + (mk.old === '' ? '(blank)' : mk.old) : '';
  if (r.deleted) return '<td class="t">' + esc(key === 'route' ? EP_REG_ROUTES[v] || '' : v) + '</td>';
  if (key === 'route') return '<td class="ro"><span class="ep-chip ' + (v === 'smartexpedit' ? 'npc' : 'min') + '">' + esc(EP_REG_ROUTES[v] || v) + '</span></td>';
  if (key === 'npcc') return '<td class="ro tabnum" title="' + esc((epSdrl(r.code) || {}).custodian ? 'custodian ' + epSdrl(r.code).custodian : 'code not in the SDRL master') + '">' + esc(v) + (r.fromSdr ? '' : ' <span class="ep-chip ' + (r.by === 'Vendor' ? 'ven' : 'npc') + '">added</span>') + '</td>';
  if (c.ro) return '<td class="ro tabnum">' + esc(v) + '</td>';
  if (key === 'npccSt' || key === 'coSt') {
    if (VIEW === 'vendor') return '<td class="ro ' + cls + '" title="' + esc(tip) + '">' + esc(v) + '</td>';
    var opts = key === 'npccSt' ? ['', 'A', 'B', 'C', 'D'] : ['', '1', '2', '3', '4', '5'];
    var lab = key === 'npccSt' ? EP_REG_NPCC_STATUS : EP_REG_CO_STATUS;
    return '<td class="' + cls + '" title="' + esc(tip) + '"><select data-cell="' + key + '">' + opts.map(function (o) {
      return '<option value="' + o + '"' + (String(v) === o ? ' selected' : '') + '>' + (o ? o + ' \u2014 ' + lab[o] : '') + '</option>'; }).join('') + '</select></td>';
  }
  var late = (key === 'planned' && v && !r.actual && v < today());
  return '<td class="' + cls + (late ? ' bad' : '') + '" title="' + esc(tip || (late ? 'overdue \u2014 not submitted' : '')) + '"><input data-cell="' + key + '"' +
    (c.date ? ' type="date"' : '') + ' value="' + esc(v) + '"' + (key === 'adnoc' && !v ? ' placeholder="assigned by Doc. Control"' : '') + '></td>';
}

    var fl = function (f) { return { npccSt:'NPCC status', coSt:'Company status', adnoc:'ADNOC no.', vendorNo:'Vendor no.', rev:'Rev', cls:'Class', title:'Title', planned:'Planned', actual:'Actual', remarks:'Remarks' }[f] || f.replace(/^x:/, ''); };
    modal('Upload \u2014 what will change',
      (prev.wrongPo ? '<div class="ep-note rose">This sheet carries the tag of <b>' + esc(prev.tagPo) + '</b>, not ' + esc(REC.po) + '.</div>' : '') +

  rail();
  renderTabs();
  var fn = { head:tabHead, mr:tabMr, docs:tabDocs, sched:tabSched, mfg:tabMfg, ship:tabShip, close:tabClose, log:tabLog, letter:tabLetter }[TAB];
  var sx = window.scrollY;
  $('content').innerHTML = fn();
  window.scrollTo(0, sx);
}

/* ------------------------------------------------------------- MODAL */
function modal(title, bodyHtml, onOk, opts) {
  opts = opts || {};
  $('modal-title').textContent = title;
  $('modal-body').innerHTML = bodyHtml;
  $('modal-box').className = 'ep-modal' + (opts.wide ? ' ' + opts.wide : '');
  $('modal-foot').innerHTML = opts.foot || '<button class="ep-btn secondary" id="modal-cancel">Cancel</button><button class="ep-btn primary" id="modal-ok">' + (opts.ok || 'OK') + '</button>';
  if ($('modal-cancel')) $('modal-cancel').onclick = closeModal;
  if ($('modal-ok')) $('modal-ok').onclick = function () { if (MODAL_OK) MODAL_OK(); };
  $('modal-bg').hidden = false;
  MODAL_OK = onOk;
}
function closeModal() { $('modal-bg').hidden = true; MODAL_OK = null; }
function ask(title, sub, label, onOk, preset) {
  modal(title, '<div class="ep-sub" style="margin-bottom:10px;">' + sub + '</div><div class="ep-lbl">' + label + '</div><input class="ep-in" id="m-ask" value="' + esc(preset || '') + '">',
    function () { var v = $('m-ask').value.trim(); if (!v) return toast(label + ' — required.'); onOk(v); });
  setTimeout(function () { var i = $('m-ask'); if (i) i.focus(); }, 30);
}

/* ------------------------------------------------------------- WIRING
   One delegated listener for clicks and one for edits — the content is
   re-rendered after every change. */
$('content').addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act],[data-sub],[data-page],[data-icell]');
  if (!t || !REC) return;
  if (t.hasAttribute('data-sub')) { SUB.sched = t.getAttribute('data-sub'); render(); return; }
  if (t.hasAttribute('data-page')) { pageModal(+t.getAttribute('data-page')); return; }
  if (t.hasAttribute('data-icell')) { var p = t.getAttribute('data-icell').split('|'); itemSetModal([+p[0]], p[1]); return; }
  var a = t.getAttribute('data-act'), id = t.getAttribute('data-id');
  switch (a) {
    case 'letter': return letterModal();
    case 'kickoff': return kickoffModal();
    case 'mr-read': return mrReadModal();
    case 'mr-checked':
      REC.mrStudy = REC.mrStudy || {}; REC.mrStudy.checkedOn = today(); REC.mrStudy.checkedBy = WHO();
      addLog('MR attachments (ITR / SDR) checked by eye.'); saveRec(); render(); return;
    case 'study': return studyModal();
    case 'reg-go': TAB = 'docs'; render(); return;
    case 'reg-create': {
      var k = epRegCreateFromSdr(REC, WHO(), SIDE());
      addLog('Vendor data register created from the MR’s SDR — ' + k + ' row(s).');
      saveRec(); render(); toast(k ? k + ' row(s) created from the SDR.' : 'Every SDR code is already on the register.'); return;
    }
    case 'reg-add': return regAddModal();
    case 'reg-col': return ask('Add a column', 'Extra columns are kept apart from the fixed format (marked *), so the register stays comparable across orders.', 'Column name', function (v) {
      epRegAddColumn(REC, v, WHO(), SIDE()); saveRec(); closeModal(); render(); });
    case 'reg-cols': return regColsModal();
    case 'reg-xlsx': downloadMiniXlsx(epRegXlsxBytes(REC), (epExpClientKind(REC) === 'adnoc' ? 'VDR ' : 'SDR ') + REC.po + '.xlsx'); toast('Downloaded — tagged with PO and register version.'); return;
    case 'reg-up': $('file-xlsx').value = ''; $('file-xlsx').click(); return;
    case 'reg-del': return ask('Delete a row', 'The row stays on the register, struck through, with your reason.', 'Reason', function (v) {
      var r = epRegDelete(REC, id, WHO(), SIDE(), v); if (!r.ok) return toast(r.msg || 'Not deleted.'); saveRec(); closeModal(); render(); });
    case 'reg-restore': epRegRestore(REC, id, WHO(), SIDE()); saveRec(); render(); return;
    case 'reg-route': return regRouteModal(id);
    case 'reply': return sendReply(t.getAttribute('data-key'));
    /* schedule */
    case 'sch-add': return ask('Add an activity', 'Added at the end; use + on a row to insert below it.', 'Activity', function (v) { epSchAdd(REC, null, v, WHO(), SIDE()); saveRec(); closeModal(); render(); });
    case 'sch-ins': return ask('Insert an activity below', 'e.g. a critical sub-order, a stage inspection, a document approval.', 'Activity', function (v) { epSchAdd(REC, id, v, WHO(), SIDE()); saveRec(); closeModal(); render(); });
    case 'sch-col': return ask('Add a column', 'e.g. Responsible party, Location, Heat number — kept as a marked extra column.', 'Column name', function (v) { epSchAddColumn(REC, v, WHO(), SIDE()); saveRec(); closeModal(); render(); });
    case 'sch-del': return ask('Delete an activity', 'It stays visible, struck through, with your reason.', 'Reason', function (v) { var r = epSchDelete(REC, id, WHO(), SIDE(), v); if (!r.ok) return toast(r.msg); saveRec(); closeModal(); render(); });
    case 'sch-na': {
      var row = epSchFind(REC, id);
      if (row.na) { epSchSetNa(REC, id, '', WHO(), SIDE()); saveRec(); render(); return; }
      return ask('Not applicable — ' + row.act, 'A minimum-requirement row cannot be deleted; it is marked not applicable with the reason.', 'Reason', function (v) { epSchSetNa(REC, id, v, WHO(), SIDE()); saveRec(); closeModal(); render(); }, t.getAttribute('data-why') || '');
    }
    case 'sch-itp': { var k2 = epSchAddItp(REC, WHO(), SIDE()); saveRec(); render(); toast(k2 + ' ITP hold / witness point(s) added before FAT / Inspection.'); return; }
    case 'sch-freeze':
      return modal('Accept the schedule and freeze the baseline', '<div class="ep-sub">From now on the baseline start / end dates do not change (rule 2). The vendor moves the forecast, and every move needs its dependency. Only a signed re-baseline can open the baseline again.</div>', function () {
        epSchFreeze(REC, WHO()); addLog('Schedule accepted — baseline frozen.'); saveRec(); closeModal(); render(); }, { ok:'Accept & freeze' });
    case 'sch-rebase':
      return modal('Re-baseline — a signed step', '<div class="ep-sub" style="margin-bottom:10px;">Opens the baseline for editing. It is recorded with the reason and the signature, and the old baseline is kept.</div>' +
        '<div class="ep-lbl">Reason</div><input class="ep-in" id="m-why" placeholder="Client-approved change order CO-03 moved the delivery by 6 weeks">' +
        '<div class="ep-lbl" style="margin-top:10px;">Signed by</div><select class="ep-sel" id="m-sig"><option>' + esc(EP_EXP_MANAGER) + ' — Expediting Manager</option><option>Sherife Aboelgheit — Senior Expediting Manager</option></select>',
        function () { var w = $('m-why').value.trim(); if (!w) return toast('Give the reason.');
          epSchRebaseline(REC, $('m-sig').value.split(' — ')[0], w); addLog('Re-baseline opened — ' + w); saveRec(); closeModal(); render(); }, { ok:'Sign & open the baseline' });
    case 'sch-issue':
      return ask('Issue the schedule as Z003', 'It becomes the next revision of Z003 Manufacturing Schedule on the register (revision and actual date set), with a snapshot for comments.', 'Description', function (v) {
        var r = epSchIssue(REC, WHO(), SIDE(), v); addLog('Schedule issued as ' + r.npcc + ' Rev ' + r.rev + ' — ' + v + '.'); saveRec(); closeModal(); SUB.sched = 'issues'; render(); }, 'Issued for Review');
    case 'sch-xlsx': return schXlsx();
    case 'it-selpage': (REC.items || []).slice(ITEM_PAGE * 25, ITEM_PAGE * 25 + 25).forEach(function (l) { ITEM_SEL[l.item] = true; }); render(); return;
    case 'it-selnone': ITEM_SEL = {}; render(); return;
    case 'it-set': return itemSetModal(Object.keys(ITEM_SEL).filter(function (k) { return ITEM_SEL[k]; }).map(Number), epSchItemsInit(REC).milestones[0].key);
    case 'it-ms': return milestonesModal();
    case 'it-prev': ITEM_PAGE = Math.max(0, ITEM_PAGE - 1); render(); return;
    case 'it-next': ITEM_PAGE++; render(); return;
    case 'sub-add': return subModal(-1);
    case 'sub-edit': return subModal(+t.getAttribute('data-i'));
    case 'crs-add':
      return modal('Comment on Z003 Rev ' + t.getAttribute('data-rev'), '<div class="ep-lbl">Ref. (page / item)</div><input class="ep-in" id="m-ref" placeholder="Page 3">' +
        '<div class="ep-lbl" style="margin-top:10px;">NMDC / ADNOC comment</div><textarea class="ep-ta" id="m-cm" placeholder="We need the manufacturing schedule for each item, not per size."></textarea>',
        function () { var c = $('m-cm').value.trim(); if (!c) return; epSchComment(REC, +t.getAttribute('data-rev'), $('m-ref').value.trim(), c, WHO()); saveRec(); closeModal(); render(); });
    case 'crs-resp':
      return ask('Vendor response', 'Your answer to the comment — kept with this revision.', 'Response', function (v) {
        epSchRespond(REC, +t.getAttribute('data-rev'), +t.getAttribute('data-sl'), v, WHO()); saveRec(); closeModal(); render(); });
    /* manufacturing / shipment / closeout / log */
    case 'pim': return pimModal();
    case 'mfg-dates': return mfgDatesModal();
    case 'ship': return shipModal();
    case 'mrv': return mrvModal();
    case 'mrb-sub':
      return modal('MRB submission', '<div class="ep-lbl">Submitted on</div><input type="date" id="m-in" class="ep-in" value="' + today() + '">', function () {
        REC.close = REC.close || {}; REC.close.mrbSubOn = $('m-in').value || today(); setStage('mrbSub'); addLog('Databook (MRB) submitted.'); saveRec(); closeModal(); render(); });
    case 'mrb-appr':
      return modal('MRB approval — closes the order', '<div class="ep-sub" style="margin-bottom:10px;">Approving the databook is the closure gate. The order will read Closed.</div><div class="ep-lbl">Approved on</div><input type="date" id="m-in" class="ep-in" value="' + today() + '">', function () {
        REC.close.mrbApprOn = $('m-in').value || today(); setStage('closed'); addLog('Databook (MRB) approved — order closed.'); saveRec(); closeModal(); render(); });
    case 'log-add':
      return modal('Add follow-up', '<div class="ep-lbl">What was done / promised</div><textarea id="m-txt" class="ep-ta" placeholder="Called the vendor — datasheets promised by 21-Oct…"></textarea>', function () {
        var v = $('m-txt').value.trim(); if (!v) return; addLog(v); saveRec(); closeModal(); render(); });
  }
});
/* edits in the grids — committed on change (leaving the cell) */
$('content').addEventListener('change', function (ev) {
  var el = ev.target;
  if (el.hasAttribute('data-isel')) { ITEM_SEL[el.getAttribute('data-isel')] = el.checked; render(); return; }
  if (!el.hasAttribute('data-cell')) return;
  var tr = el.closest('tr[data-row]'); if (!tr) return;
  var id = tr.getAttribute('data-row'), field = el.getAttribute('data-cell');
  var grid = el.closest('table').id;
  if (grid === 'reg-grid') {
    var r = epRegSet(REC, id, field, el.value, WHO(), SIDE());
    if (!r.ok) { toast(r.msg); render(); return; }
    if (field === 'actual' && el.value) setStage('docsIn');
    saveRec(); render(); return;
  }
  if (grid === 'sch-grid') {
    var res = epSchSet(REC, id, field, el.value, WHO(), SIDE());
    if (!res.ok && res.need === 'reason') {
      var v = el.value;
      return ask('The forecast moved — why?', 'The baseline is frozen. A forecast that moves needs its dependency: a manufacturing constraint, an approval waiting on our engineering, whatever the real reason is.', 'Dependency', function (why) {
        epSchSet(REC, id, field, v, WHO(), SIDE(), why); saveRec(); closeModal(); render(); });
    }
    if (!res.ok) { toast(res.msg); render(); return; }
    saveRec(); render();
  }
});
$('file-xlsx').addEventListener('change', function () { if (this.files[0]) regUpload(this.files[0]); });

/* ---------------------------------------------------------- MODALS kept from the first build */
function studyModal() {
  var st = REC.mrStudy = REC.mrStudy || {};
  modal('The study — before the kickoff',
    '<div class="ep-sub" style="margin-bottom:12px;">What the PO and the MR require. PIM, hold points and the documents are read from the ITR / SDR above; record what they do not say.</div>' +
    '<div class="ep-fields" style="grid-template-columns:repeat(2,1fr);">' +
    '<div class="ep-f"><div class="k">Payment terms</div><input id="m-pay" class="ep-in" value="' + esc(st.payment || REC.payment || '') + '"></div>' +
    '<div class="ep-f"><div class="k">Bank guarantee (PBG / ABG)</div><input id="m-bg" class="ep-in" value="' + esc(st.bg || '') + '" placeholder="PBG 10% — due 30 days from PO"></div></div>' +
    '<div class="ep-lbl">Study notes</div><textarea id="m-notes" class="ep-ta">' + esc(st.notes || '') + '</textarea>',
    function () {
      st.done = true; st.on = today(); st.payment = $('m-pay').value.trim(); st.bg = $('m-bg').value.trim(); st.notes = $('m-notes').value.trim();
      addLog('PO & MR studied — ready for the kickoff.'); saveRec(); closeModal(); render();
    });
}
function kickoffModal() {
  modal(REC.kickoffOn ? 'Update kickoff meeting' : 'Record kickoff meeting',
    '<div class="ep-sub" style="margin-bottom:12px;">At the kickoff the supplier is asked for the documents on the SDR. Recording it moves the order to Docs Requested.</div>' +
    '<div class="ep-lbl">Held on</div><input type="date" id="m-on" class="ep-in" value="' + (REC.kickoffOn || today()) + '">' +
    '<div class="ep-lbl" style="margin-top:12px;">Notes — who attended, what was agreed</div><textarea id="m-notes" class="ep-ta">' + esc(REC.kickoffNotes || '') + '</textarea>',
    function () {
      REC.kickoffOn = $('m-on').value || today(); REC.kickoffNotes = ($('m-notes').value || '').trim();
      setStage('docsOut'); addLog('Kickoff meeting held — document request issued.'); saveRec(); closeModal(); render();
    });
}
function pimModal() {
  var m = REC.mfg = REC.mfg || {};
  modal('Record PIM', '<div class="ep-sub" style="margin-bottom:12px;">The pre-inspection meeting at the supplier’s premises — the inspection plan is agreed here (4 weeks’ notice, hold for NMDC and Company on 74259).</div>' +
    '<div class="ep-lbl">Held on</div><input type="date" id="m-on" class="ep-in" value="' + (m.pimOn || today()) + '">' +
    '<div class="ep-lbl" style="margin-top:12px;">Notes</div><textarea id="m-notes" class="ep-ta">' + esc(m.pimNotes || '') + '</textarea>',
    function () { m.pimOn = $('m-on').value || today(); m.pimNotes = $('m-notes').value.trim(); setStage('pim'); addLog('PIM held at the supplier’s premises.'); saveRec(); closeModal(); render(); });
}
function mfgDatesModal() {
  var m = REC.mfg = REC.mfg || {};
  var d = function (k, id, v) { return '<div class="ep-f"><div class="k">' + k + '</div><input type="date" id="' + id + '" class="ep-in" value="' + esc(v || '') + '"></div>'; };
  modal('Fabrication & inspection dates', '<div class="ep-fields" style="grid-template-columns:repeat(2,1fr);">' +
    d('Fabrication start', 'm-fs', m.fabStart) + d('Fabrication end', 'm-fe', m.fabEnd) + d('External inspection', 'm-ei', m.extInsp) + d('Punch points closed', 'm-pn', m.punch) + d('IRN issued', 'm-irn', m.irn) + '</div>' +
    '<div class="ep-sub">Fabrication start moves the order to In Manufacture; the IRN moves it to Ready for Dispatch.</div>',
    function () {
      m.fabStart = $('m-fs').value; m.fabEnd = $('m-fe').value; m.extInsp = $('m-ei').value; m.punch = $('m-pn').value; m.irn = $('m-irn').value;
      if (m.fabStart) setStage('fab'); if (m.extInsp) setStage('insp'); if (m.irn) setStage('release');
      saveRec(); closeModal(); render();
    });
}
function shipModal() {
  var s = REC.ship = REC.ship || {};
  var i = function (k, id, v, type) { return '<div class="ep-f"><div class="k">' + k + '</div><input' + (type ? ' type="' + type + '"' : '') + ' id="' + id + '" class="ep-in" value="' + esc(v || '') + '"></div>'; };
  modal('Edit shipment', '<div class="ep-fields" style="grid-template-columns:repeat(2,1fr);">' +
    i('Mode', 'm-mode', s.mode) + i('AWB / BL no.', 'm-docno', s.docNo) + i('Carrier / forwarder', 'm-carrier', s.carrier) + i('Customs', 'm-customs', s.customs) +
    i('ETD (despatch)', 'm-etd', s.etd, 'date') + i('ETA (arrival)', 'm-eta', s.eta, 'date') + '</div><div class="ep-sub">The ETD moves the order to Shipped.</div>',
    function () {
      s.mode = $('m-mode').value; s.docNo = $('m-docno').value; s.carrier = $('m-carrier').value; s.customs = $('m-customs').value; s.etd = $('m-etd').value; s.eta = $('m-eta').value;
      if (s.etd) setStage('shipped'); saveRec(); closeModal(); render();
    });
}
function mrvModal() {
  var s = REC.ship = REC.ship || {};
  modal('Record MRV — material receipt voucher', '<div class="ep-sub" style="margin-bottom:12px;">Stores raise the MRV when the material lands. This moves the order to Delivered.</div>' +
    '<div class="ep-fields" style="grid-template-columns:repeat(3,1fr);">' +
    '<div class="ep-f"><div class="k">MRV number</div><input id="m-no" class="ep-in" value="' + esc(s.mrvNo || '') + '"></div>' +
    '<div class="ep-f"><div class="k">MRV date</div><input type="date" id="m-on" class="ep-in" value="' + today() + '"></div>' +
    '<div class="ep-f"><div class="k">Qty received</div><input id="m-qty" class="ep-in" value="' + esc(s.mrvQty || '') + '"></div></div>',
    function () { s.mrvNo = $('m-no').value.trim(); s.mrvOn = $('m-on').value || today(); s.mrvQty = $('m-qty').value.trim(); setStage('delivered'); addLog('MRV raised — material received at stores.'); saveRec(); closeModal(); render(); });
}

/* --------------------------------------------------------------- INIT */
$('back').addEventListener('click', function () {
  if (window.parent !== window) window.parent.postMessage({ epNav:'expediting', url:'expediting.html' }, '*');
  else window.location.href = 'expediting.html';
});
$('letter-btn').addEventListener('click', function () { if (REC) letterModal(); });
$('log-btn').addEventListener('click', function () { if (REC) changeLogModal(); });
$('tabs').addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-tab]'); if (!t) return;
  TAB = t.getAttribute('data-tab'); render();
});
$('view-seg').addEventListener('click', function (ev) {
  var b = ev.target.closest('[data-view]'); if (!b) return;
  VIEW = b.getAttribute('data-view'); TAB = VIEW === 'vendor' ? (REC && REC.intro ? 'letter' : 'docs') : 'head'; render();
});

PO = qs('po');
if (qs('view') === 'vendor') VIEW = 'vendor';
if (qs('tab')) TAB = qs('tab');
if (typeof epOnStateChange === 'function') epOnStateChange(function () {
  /* another pane moved this record; refresh quietly unless a pop-up is open */
  if (!$('modal-bg').hidden) return;
  var a = document.activeElement;
  if (a && a.closest && a.closest('#content') && /INPUT|SELECT|TEXTAREA/.test(a.tagName)) return;
  render();
});
render();
</script>
